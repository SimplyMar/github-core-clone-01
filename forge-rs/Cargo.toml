[package]
name = "forge-rs"
version = "0.1.0"
edition = "2021"

[dependencies]
flate2 = { version = "1.1", default-features = false, features = ["zlib-rs"] }
rustc-hash = "2.1"
serde_json = "1.0"
sha1 = "0.10"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
